<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Digitaal Dieet bonnetje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap">
<style>
  /* One column on the green field: the receipt image, then the share and download buttons. */
  :root { --veld: #67C27E; --roze: #FF8AD8; --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ext4: 1px 1px 0 #000, 2px 2px 0 #000, 3px 3px 0 #000, 4px 4px 0 #000; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--veld); color: #000; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  main { max-width: 460px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  .bon { width: 100%; aspect-ratio: 9 / 16; display: block; }
  .knop { min-height: 56px; padding: 12px 18px; border: 3px solid #000; background: var(--roze); color: #000; font: 900 18px var(--font);
    cursor: pointer; box-shadow: var(--ext4); }
  .knop.wit { background: #fff; }
  .knop:active { transform: translate(4px, 4px); box-shadow: none; }
  .knop:disabled { opacity: .5; cursor: wait; }
  .status { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 700; text-align: center; }
  .klein { margin: 0; font-size: 13px; font-weight: 600; text-align: center; }
  .fout { background: #fff; border: 3px solid #000; padding: 18px; font-size: 16px; font-weight: 600; }
  :focus-visible { outline: 3px solid #000; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="bon" id="bon" alt="">
  <button type="button" class="knop" id="deel"></button>
  <button type="button" class="knop wit" id="download"></button>
  <p class="status" id="status" aria-live="polite"></p>
  <p class="klein" id="over"></p>
  <div class="fout" id="fout" hidden></div>
</main>

const levelFor = h => LEVELS.find(l => h <= l.max);
const levelWord = l => l.key === 'godzilla' ? 'Godzilla' : l.label.toLowerCase();

/* ============================================================
   Colour helpers (tone-on-tone food in the background)
   ============================================================ */
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const rgb2hex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v + (y[i] - v) * t)); };
const isDark = bg => { const [r, g, b] = hex2rgb(bg); return (0.299 * r + 0.587 * g + 0.114 * b) < 110; };
const tones = bg => isDark(bg)
  ? { tone: mix(bg, '#fff', 0.22), line: mix(bg, '#fff', 0.7), light: mix(bg, '#000', 0.4) }
  : { tone: mix(bg, '#000', 0.12), line: mix(bg, '#000', 0.5), light: mix(bg, '#fff', 0.5) };
const mono = (svg, t) => svg
  .replace(/fill="(#[0-9A-Fa-f]{3,8})"/g, (m, c) => `fill="${c.toLowerCase() === '#000' ? t.line : c.toLowerCase() === '#fff' ? t.light : t.tone}"`)
  .replace(/stroke="(#[0-9A-Fa-f]{3,8})"/g, (m, c) => `stroke="${c.toLowerCase() === '#000' ? t.line : c.toLowerCase() === '#fff' ? t.light : t.tone}"`);

};
const foodSvg = key => { const f = FOOD[key], [x, y, s] = f.face; return f.body + `<g transform="translate(${x} ${y}) scale(${s})">${EXPR.normal}</g>`; };

/* ============================================================
   The mascot: a soft mochi, one look per eating style
   ============================================================ */
const BODY = 'M-15 12 C-17.5 12 -17.5 5 -16 0 C-13.5 -9 -7.5 -13 0 -13 C7.5 -13 13.5 -9 16 0 C17.5 5 17.5 12 15 12 Z';
const sparkle = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -5 L1.3 -1.3 L5 0 L1.3 1.3 L0 5 L-1.3 1.3 L-5 0 L-1.3 -1.3Z" fill="#FFE066" stroke="#000" stroke-width="${1 / s}" stroke-linejoin="round"/>`;
const crumbs = pts => `<g fill="#E8C38A" stroke="#000" stroke-width="0.9">${pts.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>`;

const heart = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 3 C-4 0 -4.5 -3.5 -2.2 -3.8 C-1 -4 -0.2 -3.2 0 -2.4 C0.2 -3.2 1 -4 2.2 -3.8 C4.5 -3.5 4 0 0 3Z" fill="#FF8FB8" stroke="#000" stroke-width="${0.9 / s}" stroke-linejoin="round"/>`;
const BODY_SUMO = 'M-20 12 C-23.5 12 -23.5 3 -20.5 -2 C-16.5 -9.5 -9 -12.5 0 -12.5 C9 -12.5 16.5 -9.5 20.5 -2 C23.5 3 23.5 12 20 12 Z';
let clipN = 0;

function mascot(levelKey, accent = '#FF8AD8') {
  let fill = '#FFF4E0', back = '', front = '', outside = '', transform = '', belly = '', bodyPath = BODY, faceY = 1.5, shadow = 15;
  switch (levelKey) {
    case 'kruimelaar':
      transform = 'translate(0 4.6) scale(0.62 0.7)'; shadow = 9;
      outside = sparkle(12, -3, 0.42) + heart(-12, 1, 0.55);
      break;
    case 'fijnproever':
      front = `<g transform="translate(0 -11)"><circle cx="-5" cy="-6" r="4.4" fill="#fff" ${S}/><circle cx="5" cy="-6" r="4.4" fill="#fff" ${S}/><circle cy="-8.6" r="5.2" fill="#fff" ${S}/><rect x="-7.2" y="-5" width="14.4" height="5.4" rx="1" fill="#fff" ${S}/></g>`;
      outside = `<g transform="rotate(-38 16 2)"><rect x="9" y="0.6" width="17" height="2.2" rx="1.1" fill="#E5B677" stroke="#000" stroke-width="1.2"/><rect x="9" y="4" width="17" height="2.2" rx="1.1" fill="#E5B677" stroke="#000" stroke-width="1.2"/></g>`;
      break;
    case 'lekkerbek':
      // a bit rounder, one cheek full with a bite
      transform = 'translate(0 0.4) scale(1.08 1)';
      back = `<ellipse cx="12.4" cy="3.6" rx="8.4" ry="7.6" fill="${fill}" stroke="#000" stroke-width="2.2"/>`;
      front = `<ellipse cx="12.4" cy="3.6" rx="7.3" ry="6.5" fill="${fill}"/><ellipse cx="13.4" cy="5.4" rx="3.2" ry="2" fill="#FF8FB8" opacity="0.9"/><path d="M9.4 -0.6 q2 -1.6 4.4 -0.6" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      outside = sparkle(-16, -7, 0.5) + sparkle(17, -9, 0.38);
      break;
    case 'hamster':
      fill = '#F6D3A6';
      back = `<circle cx="-9.5" cy="-10" r="4.6" fill="#F6D3A6" ${S}/><circle cx="-9.5" cy="-10" r="2.2" fill="#FFB3C7"/><circle cx="9.5" cy="-10" r="4.6" fill="#F6D3A6" ${S}/><circle cx="9.5" cy="-10" r="2.2" fill="#FFB3C7"/>`;
      belly = `<ellipse cy="8" rx="9.5" ry="5" fill="#FFF4E0"/>`;
      front = `<circle cx="-10.5" cy="5" r="5.2" fill="#FFC9DA" stroke="#000" stroke-width="1.6"/><circle cx="10.5" cy="5" r="5.2" fill="#FFC9DA" stroke="#000" stroke-width="1.6"/><circle cx="-12" cy="3.4" r="1.3" fill="#fff"/><circle cx="9" cy="3.4" r="1.3" fill="#fff"/>`;
      break;
    case 'veelvraat': {
      // sumo: wide stance, topknot, belt in the category colour; full after the meal (belly, loosened knot, satisfied puff)
      bodyPath = BODY_SUMO; faceY = -2; shadow = 22;
      const id = 'sumo' + (++clipN);
      back = `<ellipse cx="0" cy="-13.4" rx="3.4" ry="2.6" fill="#3A2A2A" ${S}/><rect x="-1.4" y="-11.6" width="2.8" height="1.6" rx="0.6" fill="${accent}" stroke="#000" stroke-width="1"/>`
           + `<ellipse cx="-12.5" cy="12.6" rx="5" ry="2.4" fill="${fill}" stroke="#000" stroke-width="1.8"/><ellipse cx="12.5" cy="12.6" rx="5" ry="2.4" fill="${fill}" stroke="#000" stroke-width="1.8"/>`;
      belly = `<clipPath id="${id}"><path d="${BODY_SUMO}"/></clipPath><g clip-path="url(#${id})">`
            + `<ellipse cy="5.4" rx="12.5" ry="7" fill="#FFFBF2" stroke="#E6D3B3" stroke-width="1"/><circle cx="0" cy="5" r="0.8" fill="#C9A77A"/>`
            + `<rect x="-24" y="8.4" width="48" height="4.4" fill="${accent}" stroke="#000" stroke-width="1.6"/></g>`
            + `<path d="M-2.4 8.4 h4.8 l0.8 5.6 h-6.4z" fill="${accent}" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>`;
      front = '';
      outside = `<g transform="translate(19 -9)" fill="#fff" stroke="#000" stroke-width="1"><circle r="2.4"/><circle cx="2.6" cy="-1.6" r="1.8"/><circle cx="4.4" cy="0.6" r="1.5"/></g>`;
      break;
    }
    case 'godzilla':
      fill = '#C9EFC0'; transform = 'translate(0 -2) scale(1.2)';
      back = `<path d="M-12 -6 L-9 -14 L-5.5 -9.5 L-1.5 -18 L2.5 -9.5 L6.5 -14.5 L10 -6 Z" fill="#5BBE5F" ${S}/><path d="M12 7 q9 1 12 -6 q-0.5 9 -10.5 11z" fill="#5BBE5F" ${S}/>`;
      front = `<path transform="translate(5.8 4.4) scale(1.25)" d="M0 0 q6 -3.5 10 -0.5 q-2 1 -1 3 q-4.5 -1 -9 -2.5z" fill="#FF8A3D" stroke="#000" stroke-width="0.9" stroke-linejoin="round"/>`;
      break;
  }
  const face = `<g transform="translate(0 ${faceY}) scale(1.25)">${EXPR[levelKey]}</g>`;
  const body = `<path d="${bodyPath}" fill="${fill}" ${S}/>${belly}<path d="M-10 -5.5 q3 -4.5 7.5 -5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  return `<ellipse cy="13.6" rx="${shadow}" ry="2.2" fill="#000" opacity="0.14"/><g class="figuur"><g transform="${transform}">${back}${body}${face}${front}</g>${outside}</g>`;
}

// belt colour: the category colour, darkened when it is too pale to read against the mochi
const beltFor = bg => { const [r, g, b] = hex2rgb(bg); return (0.299 * r + 0.587 * g + 0.114 * b) > 215 ? mix(bg, '#000', 0.25) : bg; };

// Mascot in front, the category food tone-on-tone behind it, on a plate in the category colour
const plateSvg = (cat, levelKey, size, label) => {
  const t = tones(cat.bg), f = mono(foodSvg(cat.food), t);
  return `<svg width="${size}" height="${size}" viewBox="-32 -36 64 64" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}>
    <g transform="translate(15 -17) rotate(14) scale(1.05)">${f}</g>
    <g transform="translate(-19 -9) rotate(-12) scale(0.62)">${f}</g>
    <g transform="translate(0 4)">${mascot(levelKey, beltFor(cat.bg))}</g>
  </svg>`;
};
const mascotSvg = (levelKey, size, accent) => `<svg width="${size}" height="${size}" viewBox="-28 -34 56 56" aria-hidden="true">${mascot(levelKey, accent)}</svg>`;

/* ===========================================================
   BALANCE CARD ART ("Jouw balans"): the scale scene, the five level characters and the activity
   icons. Ported from claude/balance_art.js (modules chat), same mochi style as the bento mascots.
   =========================================================== */
const BAL_ART = (() => {
  const S = 'stroke="#000" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"';
  const blush = (o = 0.9) => `<ellipse cx="-5.8" cy="2.3" rx="2.3" ry="1.4" fill="#FF8FB8" opacity="${o}"/><ellipse cx="5.8" cy="2.3" rx="2.3" ry="1.4" fill="#FF8FB8" opacity="${o}"/>`;
  const eyes = (r = 1.6, hl = 0.55) => `<circle cx="-3.4" r="${r}" fill="#000"/><circle cx="3.4" r="${r}" fill="#000"/><circle cx="${-3.4 + r * 0.32}" cy="${-r * 0.38}" r="${hl}" fill="#fff"/><circle cx="${3.4 + r * 0.32}" cy="${-r * 0.38}" r="${hl}" fill="#fff"/>`;
  const line = (d, w = 1.1, c = '#000') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const BODY = 'M-15 12 C-17.5 12 -17.5 5 -16 0 C-13.5 -9 -7.5 -13 0 -13 C7.5 -13 13.5 -9 16 0 C17.5 5 17.5 12 15 12 Z';
  const shine = '<path d="M-10 -5.5 q3 -4.5 7.5 -5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  const sparkle = (x, y, s, f = '#FFE066') => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -5 L1.3 -1.3 L5 0 L1.3 1.3 L0 5 L-1.3 1.3 L-5 0 L-1.3 -1.3Z" fill="${f}" stroke="#000" stroke-width="${1 / s}" stroke-linejoin="round"/>`;
  // a thick limb or tail: black outline under a coloured stroke
  const limb = (d, c, w = 3.4) => `<path d="${d}" fill="none" stroke="#000" stroke-width="${w + 2.2}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

  function mascot(key, opts = {}) {
    const face = expr => `<g transform="translate(0 1.5) scale(1.25)">${expr}</g>`;
    switch (key) {
      case 'zen': {
        // floating, eyes closed, legs crossed, a leaf on top
        const legs = `<ellipse cx="-7" cy="11.4" rx="8" ry="3.4" fill="#FFF4E0" ${S}/><ellipse cx="7" cy="11.4" rx="8" ry="3.4" fill="#FFF4E0" ${S}/>`;
        const hands = `<ellipse cx="0" cy="8.6" rx="3.6" ry="2.4" fill="#FFF4E0" stroke="#000" stroke-width="1.6"/>`;
        const leaf = `<path d="M0 -13 q-1 -6 4 -8.5 q1.5 5.5 -4 8.5z" fill="#7BCB6B" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>`;
        const expr = blush() + line('M-5 0.2 q1.5 1.3 3 0 M2 0.2 q1.5 1.3 3 0') + line('M-1.3 2.2 q1.3 1.1 2.6 0');
        return `<g transform="translate(0 -3)">${leaf}<path d="${BODY}" fill="#FFF4E0" ${S}/>${shine}${face(expr)}${legs}${hands}</g>`
          + (opts.extras === false ? '' : sparkle(-21, -10, 0.45) + sparkle(20, -16, 0.38, '#C8F2EC') + sparkle(22, 2, 0.3));
      }
      case 'ninja': {
        // dark hood, a cream band with the eyes, pink headband tails, on one foot
        const band = `<rect x="-12.5" y="-3.4" width="25" height="9.4" rx="4.7" fill="#FFF4E0" stroke="#000" stroke-width="1.6"/>`;
        const head = `<path d="M-15.5 -4.6 C-12 -10.5 12 -10.5 15.5 -4.6" fill="none" stroke="#FF8AD8" stroke-width="3.6" stroke-linecap="round"/>`
          + `<path d="M-15.5 -4.6 C-12 -10.5 12 -10.5 15.5 -4.6" fill="none" stroke="#000" stroke-width="0.9" stroke-linecap="round" opacity="0.25"/>`;
        const tails = `<path d="M14 -6 q8 -4 14 -2 q-6 1 -9 4z M14 -5 q7 2 11 7 q-6 -1 -10 -3z" fill="#FF8AD8" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>`;
        const expr = eyes(1.5, 0.5) + line('M-5.4 -2.6 l3.2 1 M5.4 -2.6 l-3.2 1', 1.2);
        const foot = `<ellipse cx="-2" cy="12.6" rx="4.6" ry="2.2" fill="#3A3A4A" stroke="#000" stroke-width="1.8"/><ellipse cx="9" cy="8.5" rx="4.2" ry="2" fill="#3A3A4A" stroke="#000" stroke-width="1.8" transform="rotate(-30 9 8.5)"/>`;
        return `${tails}<path d="${BODY}" fill="#3A3A4A" ${S}/>${foot}<path d="M-10 -5.5 q3 -4.5 7.5 -5" stroke="#8A8AA0" stroke-width="2.2" fill="none" stroke-linecap="round"/>${head}${band}${face(expr)}`
          + (opts.extras === false ? '' : line('M-24 4 h-6 M-23 9 h-8', 1.4, '#000'));
      }
      case 'koord': {

        const expr = `<circle cx="-3.6" cy="0" r="2.1" fill="#fff" stroke="#000" stroke-width="0.8"/><circle cx="-4.2" cy="0.3" r="0.8" fill="#000"/><circle cx="3.6" cy="0.2" r="1.3" fill="#000"/>`

          + (opts.extras === false ? '' : `<path d="M14 -6 q3 -1 4 2 M16 -10 q3 -1 4 2" fill="none" stroke="#000" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>`);

      || `<g transform="translate(0 -6)">${sparkle(-10, -4, 0.5)}${sparkle(9, -9, 0.4)}</g>`;
    const beam = `<g transform="translate(${P.x} ${P.y}) rotate(${-tilt})"><rect x="-${R + 6}" y="-5" width="${2 * R + 12}" height="10" rx="5" fill="#fff" ${S}/><path d="M-${R - 4} -1 H-20 M20 -1 H${R - 4}" stroke="#000" stroke-width="0.9" stroke-dasharray="2 5" opacity="0.4"/></g>`;
    const base = `<ellipse cx="${P.x}" cy="231" rx="78" ry="6" fill="#000" opacity="0.14"/><rect x="${P.x - 7}" y="${P.y}" width="14" height="108" fill="#FFC93C" ${S}/><path d="M${P.x - 46} 228 L${P.x - 34} 206 H${P.x + 34} L${P.x + 46} 228Z" fill="#FFC93C" ${S}/>`;
    const pivot = `<circle cx="${P.x}" cy="${P.y}" r="9" fill="#FFC93C" ${S}/><circle cx="${P.x}" cy="${P.y}" r="3" fill="#000"/>`;

/* ============================================================
   The shareable receipt ("bonnetje"): one SVG of 1080 x 1920 (9:16 story),
   rendered to PNG in the browser and shared via the phone's share sheet.
   ============================================================ */
const B_W = 1080, B_H = 1920;
const FONT_URL = 'https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.3.0/files/archivo-latin-standard-normal.woff2';
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let FONT_CSS = '';

// The font has to live inside the SVG, otherwise the PNG falls back to a system font.
async function loadFontCss() {
  if (FONT_CSS) return FONT_CSS;
  try {
    // offline build: the font is already inlined as a data URL in a <style>
    const inline = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n')
      .match(/url\((data:font\/woff2;base64,[^)]+)\)/);
    let url = inline && inline[1];
    if (!url) {
      const blob = await (await fetch(FONT_URL)).blob();
      url = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
    }
    FONT_CSS = `@font-face{font-family:'BonFont';src:url(${url}) format('woff2');font-weight:100 900;}`;
  } catch (e) { FONT_CSS = ''; }
  return FONT_CSS;
}

// Text width for layout (dot leaders, badge size). Uses the page font, which is the same Archivo.
const measureCtx = document.createElement('canvas').getContext('2d');
const textW = (txt, size, weight = 700) => { measureCtx.font = `${weight} ${size}px Archivo, system-ui, sans-serif`; return measureCtx.measureText(txt).width; };

// Deterministic barcode from the profile name
const barcode = (seed, x, y, w, h) => {
  let n = [...seed].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7), out = '', cx = x;
  while (cx < x + w) {
    n = (n * 1103515245 + 12345) >>> 0;
    const bw = 3 + (n >> 8) % 9, gap = 3 + (n >> 16) % 7;
    if (cx + bw > x + w) break;
    out += `<rect x="${cx}" y="${y}" width="${bw}" height="${h}" fill="#000"/>`;
    cx += bw + gap;
  }
  return out;
};

// Receipt outline with zigzag top and bottom edges
const receiptPath = (x0, y0, x1, y1, tooth = 26, depth = 14) => {
  const n = Math.floor((x1 - x0) / tooth), step = (x1 - x0) / n;
  let d = `M${x0} ${y0 + depth}`;
  for (let i = 0; i < n; i++) d += ` L${x0 + step * (i + 0.5)} ${y0} L${x0 + step * (i + 1)} ${y0 + depth}`;
  d += ` L${x1} ${y1 - depth}`;
  for (let i = n; i > 0; i--) d += ` L${x0 + step * (i - 0.5)} ${y1} L${x0 + step * (i - 1)} ${y1 - depth}`;
  return d + 'Z';
};

/* p = { dish, level, top: [{cat, pct}], skipPct, hours, avg, app, date } */

/* ============================================================
   The receipt: diet ("dieet"), balance ("balans") or both ("beide"), built top to bottom with a
   y cursor, then scaled to fit the 1080 x 1920 story when it gets too long.
   p = bonResolve(...): { kind, lang, date, app, diet?: {...}, bal?: {...} }
   ============================================================ */
function bonnetjeSvg(p) {
  const X0 = 110, X1 = 970, L = X0 + 56, R = X1 - 56, CX = 540;
  const S = BON_STR[p.lang], both = p.kind === 'beide';

  const $ = id => document.getElementById(id);
  const UI = {
    nl: { deel: 'Deel je bonnetje', download: 'Download als plaatje', making: 'Bonnetje maken...', done: 'Gedownload.',
          fail: 'Dat lukte niet. Probeer Download.', over: 'Gemaakt in de Digitaal Dieet studie. Op dit bonnetje staat niets persoonlijks.',
          bad: 'Dit bonnetje kon niet worden geladen. Controleer of je de hele link hebt gekopieerd.', alt: 'Digitaal Dieet bonnetje' },
    en: { deel: 'Share your receipt', download: 'Download as image', making: 'Making your receipt...', done: 'Downloaded.',
          fail: 'That did not work. Try Download.', over: 'Made in the Digital Diet study. There is nothing personal on this receipt.',
          bad: 'This receipt could not be loaded. Check that you copied the whole link.', alt: 'Digital Diet receipt' }
  };
  const raw = BON.bonDecode(location.hash);
  const lang = raw?.lang || ((navigator.language || '').startsWith('en') ? 'en' : 'nl');
  const u = UI[lang] || UI.nl;
  document.documentElement.lang = lang;
  if (!raw) {
    ['bon', 'deel', 'download', 'over'].forEach(id => { $(id).hidden = true; });
    $('fout').hidden = false; $('fout').textContent = u.bad; return;
  }
  const p = BON.bonResolve(raw);
  $('deel').textContent = u.deel; $('download').textContent = u.download; $('over').textContent = u.over; $('bon').alt = `${u.alt}: ${p.name}`;
  let svg = BON.bonnetjeSvg(p);
  const show = () => { $('bon').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); };
  show();
  await document.fonts.ready; await BON.loadFontCss(); svg = BON.bonnetjeSvg(p); show();

  $('deel').addEventListener('click', async () => {
    $('deel').disabled = true; $('status').textContent = u.making;
    try { const r = await BON.bonShareOrDownload(svg, p.lang); $('status').textContent = r === 'downloaded' ? u.done : ''; }
    catch (e) { $('status').textContent = u.fail; }
    $('deel').disabled = false;
  });
  $('download').addEventListener('click', async () => {
    try { BON.bonDownload(await BON.bonFile(svg, p.lang)); $('status').textContent = u.done; } catch (e) { $('status').textContent = u.fail; }
  });
})();
</script>
</body>
</html>
