<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Digitaal Dieet bonnetje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&display=swap">
<style>
  /* One column on the green field: the receipt image, then the share and download buttons. */
  :root { --veld: #67C27E; --roze: #FF8AD8; --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ext4: 1px 1px 0 #000, 2px 2px 0 #000, 3px 3px 0 #000, 4px 4px 0 #000; color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--veld); color: #000; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  main { max-width: 460px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  .bon { width: 100%; aspect-ratio: 9 / 16; display: block; }
  .knop { min-height: 56px; padding: 12px 18px; border: 3px solid #000; background: var(--roze); color: #000; font: 900 18px var(--font);
    cursor: pointer; box-shadow: var(--ext4); }
  .knop.wit { background: #fff; }
  .knop:active { transform: translate(4px, 4px); box-shadow: none; }
  .knop:disabled { opacity: .5; cursor: wait; }
  .status { margin: 0; min-height: 1.4em; font-size: 14px; font-weight: 700; text-align: center; }
  .klein { margin: 0; font-size: 13px; font-weight: 600; text-align: center; }
  .fout { background: #fff; border: 3px solid #000; padding: 18px; font-size: 16px; font-weight: 600; }
  :focus-visible { outline: 3px solid #000; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="bon" id="bon" alt="">
  <button type="button" class="knop" id="deel"></button>
  <button type="button" class="knop wit" id="download"></button>
  <p class="status" id="status" aria-live="polite"></p>
  <p class="klein" id="over"></p>
  <div class="fout" id="fout" hidden></div>
</main>
<script>

const BON = (() => {

  tamago:   { top: -8,    face: [0, 2, 0.8],    body: `<rect x="-13" y="-8" width="26" height="16" rx="4.5" fill="#FFD84D" ${S}/><path d="M-10 -3.5h20" stroke="#E0A800" stroke-width="1.3" stroke-linecap="round"/>` },
  aardbei:  { top: -10,   face: [0, 1.5, 0.8],  body: `<path d="M0 13 C-8 9 -13 2 -12 -4 C-11 -10 -4 -10 0 -8 C4 -10 11 -10 12 -4 C13 2 8 9 0 13Z" fill="#F45B73" ${S}/><path d="M-6 -9 L-2 -11 L0 -14 L2 -11 L6 -9 L2 -8 L0 -6.5 L-2 -8Z" fill="#5BBE5F" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/><g fill="#FFE08A"><circle cx="-7.5" cy="-3" r="0.9"/><circle cx="7.5" cy="-3" r="0.9"/><circle cx="-4" cy="8" r="0.9"/><circle cx="4" cy="8" r="0.9"/></g>` },

  nigiri:   { top: -8,    face: [0, 5.5, 0.7],  body: `<rect x="-12.5" y="-1" width="25" height="12" rx="6" fill="#fff" ${S}/><path d="M-13.5 0 C-10 -10 10 -10 13.5 0 C8 2.5 -8 2.5 -13.5 0Z" fill="#FF9E7A" ${S}/><path d="M-6 -5 l3 3 M0 -6 l3 3 M6 -5 l2.5 2.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>` },
  dumpling: { top: -7,    face: [0, 2, 0.8],    body: `<path d="M-14 6 C-13 -9 13 -9 14 6 C9 9 -9 9 -14 6Z" fill="#fff" ${S}/><path d="M-7 -4 l1.4 3 M-2.4 -6 l0.9 3.1 M2.4 -6 l-0.9 3.1 M7 -4 l-1.4 3" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>` },
  snoep:    { top: -8.5,  face: [0, 0, 0.75],   body: `<path d="M-7 0 L-14 -7 L-14 7 Z M7 0 L14 -7 L14 7 Z" fill="#FFC93C" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><circle r="8.5" fill="#FF6FAE" ${S}/>` },
  noedels:  { top: -10,   face: [0, 3.5, 0.8],  body: `<path d="M-10 -3 C-10 -10 -4 -10 -4 -3 M-4 -3 C-4 -12.5 3 -12.5 3 -3 M3 -3 C3 -10 10 -10 10 -3" fill="#FFD66B" stroke="#000" stroke-width="1.6"/><path d="M-14 -3 H14 C14 7 7 12 0 12 C-7 12 -14 7 -14 -3Z" fill="#8EC5FF" ${S}/>` },
  popcorn: { top: -12, face: [0, 5, 0.72], body: `<path d="M-10 -3 L10 -3 L7.5 13 L-7.5 13 Z" fill="#fff" ${S}/><path d="M-6.5 -3 L-3.5 -3 L-3 13 L-5.4 13 Z M1.6 -3 L4.6 -3 L3.6 13 L1.2 13 Z" fill="#E5484D"/><path d="M-10 -3 L10 -3 L7.5 13 L-7.5 13 Z" fill="none" ${S}/><g fill="#FFF3C4" stroke="#000" stroke-width="1.6"><circle cx="-7" cy="-5" r="3.6"/><circle cx="7" cy="-5" r="3.6"/><circle cx="-2.6" cy="-8" r="3.8"/><circle cx="2.8" cy="-8.4" r="3.6"/><circle cx="0" cy="-4.6" r="3.4"/></g>` },

  banaan: { top: -12, face: [-4.2, 2.6, 0.62], body: `<path d="M-12.5 -8 C-14 7 -1 15 13 4.5 C12.5 0.5 10 -0.5 7.5 1 C0 5 -4.5 0 -5 -8.5 C-5.5 -11.5 -11.5 -11.5 -12.5 -8 Z" fill="#FFE066" ${S}/><path d="M-11.6 -9.6 L-11.4 -13 L-8.2 -11.6 Z" fill="#7A5A2E" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/><path d="M-10 -2 C-9 5 -3 9.5 4 9" fill="none" stroke="#E0B400" stroke-width="1.4" stroke-linecap="round"/>` },
  donut: { top: -12, face: [0, 6.2, 0.55], body: `<circle r="12.5" fill="#E8B26A" ${S}/><path d="M-10.5 -1 C-11 -9 -4 -12 1 -11 C8 -10.5 11.5 -5 10.6 1 C10 4 8 3 7 5.5 C5.5 8 2 6 0 7.5 C-2.5 9 -5 7 -6.5 5.5 C-8.5 3.5 -10.4 3 -10.5 -1 Z" fill="#FF8AD8" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/><circle cy="-2" r="3.4" fill="#fff" stroke="#000" stroke-width="1.8"/><g stroke-width="1.6" stroke-linecap="round"><path d="M-6 -7 l1.6 -1" stroke="#7C5CFF"/><path d="M5 -8 l1.8 0.6" stroke="#67C27E"/><path d="M7 -2 l0.8 1.6" stroke="#FFC93C"/><path d="M-8 -2 l0.6 1.8" stroke="#8EC5FF"/></g>` },
  boba: { top: -12, face: [0, 1.4, 0.7], body: `<path d="M3 -15 L6.5 -6" stroke="#000" stroke-width="4.4" stroke-linecap="round"/><path d="M3 -15 L6.5 -6" stroke="#FF8AD8" stroke-width="2.4" stroke-linecap="round"/><path d="M-9 -6 L9 -6 L7 13 L-7 13 Z" fill="#F3D9B1" ${S}/><ellipse cy="-6" rx="10" ry="2.6" fill="#fff" ${S}/><g fill="#3A2A2A"><circle cx="-4" cy="10" r="1.6"/><circle cx="0" cy="10.6" r="1.6"/><circle cx="4" cy="10" r="1.6"/><circle cx="-2" cy="7.6" r="1.5"/><circle cx="2.2" cy="7.8" r="1.5"/></g>` },
  dango:    { top: -12,   face: [0, 0, 0.5],    body: `<path d="M-13 13 L13 -13" stroke="#000" stroke-width="3.6" stroke-linecap="round"/><path d="M-13 13 L13 -13" stroke="#E8C38A" stroke-width="1.6" stroke-linecap="round"/><circle cx="-7" cy="7" r="5.6" fill="#FFB3D1" ${S}/><circle cx="7" cy="-7" r="5.6" fill="#A8E07A" ${S}/><circle r="5.8" fill="#fff" ${S}/>` }

// Categories as in the experiment: label, food, profile word, colour (same pastel as the bento compartments)
const CATS = [
  ['entertainment', 'Entertainment', 'maki', 'Sushi', '#FFE07A'],
  ['lifestyle', 'Lifestyle', 'macaron', 'Macaron', '#C7F0DA'],
  ['health', 'Gezondheid & Welzijn', 'thee', 'Matcha', '#E3F4C8'],
  ['fitness', 'Fitness & Voeding', 'ei', 'Eitjes', '#CFE6FF'],
  ['sport', 'Sport', 'onigiri', 'Onigiri', '#FFB98A'],
  ['motivation', 'Motivatie & Self-improvement', 'tamago', 'Omelet', '#D9CCFF'],
  ['relationships', 'Relaties', 'aardbei', 'Aardbei', '#FFD3E0'],
  ['learning', 'Leren & Vaardigheden', 'broccoli', 'Broccoli', '#C8F2EC'],
  ['news', 'Nieuws & Samenleving', 'nigiri', 'Nigiri', '#E1E7EF'],
  ['ads', 'Reclame', null, null, '#FFEFC9'],
  ['relatable', 'Relatable', 'dumpling', 'Dumpling', '#BBA8FF'],
  ['brainrot', 'Brainrot / Low-quality', 'snoep', 'Snoepjes', '#A8EDEA'],
  ['misleading', 'Misleidend / Fake News', null, null, '#FFE1D6'],
  ['negative', 'Schadelijk / Toxisch', null, null, '#4A4458'],
  ['illegal', 'Illegale Content', null, null, '#B9C4D0'],
  ['clips', 'Clips & Edits', 'popcorn', 'Popcorn', '#F7B5CA'],
  ['dance', 'Dans', 'donut', 'Donut', '#EDB3F2'],
  ['challenge', 'Challenge', 'ijsje', 'Ijsje', '#8FD3FF'],
  ['glowup', 'Glow-up', 'boba', 'Boba', '#FFD9B0'],
  ['animals', 'Dieren', 'banaan', 'Banaan', '#D4E6A1'],
  ['live', 'Live', 'pizza', 'Pizza', '#FF9E9E'],
  ['other', 'Anders', 'noedels', 'Noedel', '#FFFFFF']
].map(([value, label, food, naam, bg]) => ({ value, label, food, naam, bg }));
const FALLBACK = { value: '_bento', label: 'Bento', food: 'dango', naam: 'Bento', bg: '#EDEDED' };

const LEVELS = [
  { key: 'kruimelaar',  label: 'Kruimelaar',  max: 4,        band: '<5',    zin: 'Je pakt alleen een paar kruimels van je scherm. Lekker bezig!' },
  { key: 'fijnproever', label: 'Fijnproever', max: 10,       band: '5-10',  zin: 'Je kiest wat je kijkt, en je geniet ervan.' },
  { key: 'lekkerbek',   label: 'Lekkerbek',   max: 15,       band: '11-15', zin: 'Je smult flink van je scherm. Let op dat het niet meer wordt.' },
  { key: 'hamster',     label: 'Hamster',     max: 20,       band: '16-20', zin: 'Je propt er best veel in: je wangen zitten aardig vol.' },
  { key: 'veelvraat',   label: 'Veelvraat',   max: 29,       band: '21-29', zin: 'Je zit vol: je scherm eet een groot deel van je vrije tijd op.' },
  { key: 'godzilla',    label: 'Godzilla',    max: Infinity, band: '30+',   zin: 'Je scherm slokt bijna al je vrije tijd op.' }
];
const levelFor = h => LEVELS.find(l => h <= l.max);
const levelWord = l => l.key === 'godzilla' ? 'Godzilla' : l.label.toLowerCase();

/* ============================================================
   Colour helpers (tone-on-tone food in the background)
   ============================================================ */
const hex2rgb = h => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const rgb2hex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v + (y[i] - v) * t)); };
const isDark = bg => { const [r, g, b] = hex2rgb(bg); return (0.299 * r + 0.587 * g + 0.114 * b) < 110; };
const tones = bg => isDark(bg)
  ? { tone: mix(bg, '#fff', 0.22), line: mix(bg, '#fff', 0.7), light: mix(bg, '#000', 0.4) }
  : { tone: mix(bg, '#000', 0.12), line: mix(bg, '#000', 0.5), light: mix(bg, '#fff', 0.5) };
const mono = (svg, t) => svg
  .replace(/fill="(#[0-9A-Fa-f]{3,8})"/g, (m, c) => `fill="${c.toLowerCase() === '#000' ? t.line : c.toLowerCase() === '#fff' ? t.light : t.tone}"`)
  .replace(/stroke="(#[0-9A-Fa-f]{3,8})"/g, (m, c) => `stroke="${c.toLowerCase() === '#000' ? t.line : c.toLowerCase() === '#fff' ? t.light : t.tone}"`);

/* ============================================================
   Faces
   ============================================================ */
const blush = (o = 0.9) => `<ellipse cx="-5.8" cy="2.3" rx="2.3" ry="1.4" fill="#FF8FB8" opacity="${o}"/><ellipse cx="5.8" cy="2.3" rx="2.3" ry="1.4" fill="#FF8FB8" opacity="${o}"/>`;
const eyes = (r = 1.6, hl = 0.55) => `<circle cx="-3.4" r="${r}" fill="#000"/><circle cx="3.4" r="${r}" fill="#000"/><circle cx="${-3.4 + r * 0.32}" cy="${-r * 0.38}" r="${hl}" fill="#fff"/><circle cx="${3.4 + r * 0.32}" cy="${-r * 0.38}" r="${hl}" fill="#fff"/>`;
const line = (d, w = 1.1) => `<path d="${d}" fill="none" stroke="#000" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const EXPR = {
  normal:      blush() + eyes() + line('M-1.5 1.7 q1.5 1.5 3 0'),
  kruimelaar:  blush() + line('M-4.8 0.6 q1.4 -2 2.8 0 M2 0.6 q1.4 -2 2.8 0') + `<path d="M-1.8 1.6 h3.6 q-0.3 2.4 -1.8 2.4 q-1.5 0 -1.8 -2.4z" fill="#3A1F1F" stroke="#000" stroke-width="0.8" stroke-linejoin="round"/><ellipse cy="3.3" rx="0.9" ry="0.55" fill="#FF6F91"/>`,
  fijnproever: blush() + line('M-5 0.6 q1.6 -2 3.2 0 M1.8 0.6 q1.6 -2 3.2 0') + line('M-1.5 1.8 q1.5 1.5 3 0'),
  lekkerbek:   `<ellipse cx="-5.8" cy="2.3" rx="2.3" ry="1.4" fill="#FF8FB8" opacity="0.9"/>` + eyes() + line('M-3.2 2.2 q0.9 0.9 1.8 0 q0.9 0.9 1.8 0'),
  hamster:     eyes(1.8, 0.7) + line('M-2 1.7 q1 1.1 2 0 q1 1.1 2 0'),
  veelvraat:   blush(1) + line('M-5.2 -0.2 q1.6 1.5 3.2 0 M2 -0.2 q1.6 1.5 3.2 0') + `<ellipse cx="0.4" cy="3.2" rx="1.6" ry="1.4" fill="#3A1F1F" stroke="#000" stroke-width="0.9"/><path d="M-2.6 -3.4 q0 -1 1 -1.2" fill="none" stroke="#000" stroke-width="0" />`,
  godzilla:    blush(0.35) + eyes() + line('M-5.8 -3 L-2 -1.6 M5.8 -3 L2 -1.6') + `<path d="M-3.2 1.3 h6.4 q-0.4 2.8 -3.2 2.8 q-2.8 0 -3.2 -2.8z" fill="#3A1F1F" stroke="#000" stroke-width="0.8"/><path d="M-2.6 1.3 h1.3 l-0.65 1z M-0.65 1.3 h1.3 l-0.65 1z M1.3 1.3 h1.3 l-0.65 1z" fill="#fff"/>`
};
const foodSvg = key => { const f = FOOD[key], [x, y, s] = f.face; return f.body + `<g transform="translate(${x} ${y}) scale(${s})">${EXPR.normal}</g>`; };

/* ============================================================
   The mascot: a soft mochi, one look per eating style
   ============================================================ */
const BODY = 'M-15 12 C-17.5 12 -17.5 5 -16 0 C-13.5 -9 -7.5 -13 0 -13 C7.5 -13 13.5 -9 16 0 C17.5 5 17.5 12 15 12 Z';
const sparkle = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -5 L1.3 -1.3 L5 0 L1.3 1.3 L0 5 L-1.3 1.3 L-5 0 L-1.3 -1.3Z" fill="#FFE066" stroke="#000" stroke-width="${1 / s}" stroke-linejoin="round"/>`;
const crumbs = pts => `<g fill="#E8C38A" stroke="#000" stroke-width="0.9">${pts.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>`;

const heart = (x, y, s) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 3 C-4 0 -4.5 -3.5 -2.2 -3.8 C-1 -4 -0.2 -3.2 0 -2.4 C0.2 -3.2 1 -4 2.2 -3.8 C4.5 -3.5 4 0 0 3Z" fill="#FF8FB8" stroke="#000" stroke-width="${0.9 / s}" stroke-linejoin="round"/>`;
const BODY_SUMO = 'M-20 12 C-23.5 12 -23.5 3 -20.5 -2 C-16.5 -9.5 -9 -12.5 0 -12.5 C9 -12.5 16.5 -9.5 20.5 -2 C23.5 3 23.5 12 20 12 Z';
let clipN = 0;

function mascot(levelKey, accent = '#FF8AD8') {
  let fill = '#FFF4E0', back = '', front = '', outside = '', transform = '', belly = '', bodyPath = BODY, faceY = 1.5, shadow = 15;
  switch (levelKey) {
    case 'kruimelaar':
      transform = 'translate(0 4.6) scale(0.62 0.7)'; shadow = 9;
      outside = sparkle(12, -3, 0.42) + heart(-12, 1, 0.55);
      break;
    case 'fijnproever':
      front = `<g transform="translate(0 -11)"><circle cx="-5" cy="-6" r="4.4" fill="#fff" ${S}/><circle cx="5" cy="-6" r="4.4" fill="#fff" ${S}/><circle cy="-8.6" r="5.2" fill="#fff" ${S}/><rect x="-7.2" y="-5" width="14.4" height="5.4" rx="1" fill="#fff" ${S}/></g>`;
      outside = `<g transform="rotate(-38 16 2)"><rect x="9" y="0.6" width="17" height="2.2" rx="1.1" fill="#E5B677" stroke="#000" stroke-width="1.2"/><rect x="9" y="4" width="17" height="2.2" rx="1.1" fill="#E5B677" stroke="#000" stroke-width="1.2"/></g>`;
      break;
    case 'lekkerbek':
      // a bit rounder, one cheek full with a bite

/* ============================================================
   The shareable receipt ("bonnetje"): one SVG of 1080 x 1920 (9:16 story),
   rendered to PNG in the browser and shared via the phone's share sheet.
   ============================================================ */
const B_W = 1080, B_H = 1920;
const FONT_URL = 'https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.3.0/files/archivo-latin-standard-normal.woff2';
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let FONT_CSS = '';

// The font has to live inside the SVG, otherwise the PNG falls back to a system font.
async function loadFontCss() {
  if (FONT_CSS) return FONT_CSS;
  try {
    // offline build: the font is already inlined as a data URL in a <style>
    const inline = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n')
      .match(/url\((data:font\/woff2;base64,[^)]+)\)/);
    let url = inline && inline[1];
    if (!url) {
      const blob = await (await fetch(FONT_URL)).blob();
      url = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
    }
    FONT_CSS = `@font-face{font-family:'BonFont';src:url(${url}) format('woff2');font-weight:100 900;}`;
  } catch (e) { FONT_CSS = ''; }
  return FONT_CSS;
}

// Text width for layout (dot leaders, badge size). Uses the page font, which is the same Archivo.
const measureCtx = document.createElement('canvas').getContext('2d');
const textW = (txt, size, weight = 700) => { measureCtx.font = `${weight} ${size}px Archivo, system-ui, sans-serif`; return measureCtx.measureText(txt).width; };

// Deterministic barcode from the profile name
const barcode = (seed, x, y, w, h) => {
  let n = [...seed].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7), out = '', cx = x;
  while (cx < x + w) {
    n = (n * 1103515245 + 12345) >>> 0;
    const bw = 3 + (n >> 8) % 9, gap = 3 + (n >> 16) % 7;
    if (cx + bw > x + w) break;
    out += `<rect x="${cx}" y="${y}" width="${bw}" height="${h}" fill="#000"/>`;
    cx += bw + gap;
  }
  return out;
};

// Receipt outline with zigzag top and bottom edges
const receiptPath = (x0, y0, x1, y1, tooth = 26, depth = 14) => {
  const n = Math.floor((x1 - x0) / tooth), step = (x1 - x0) / n;
  let d = `M${x0} ${y0 + depth}`;
  for (let i = 0; i < n; i++) d += ` L${x0 + step * (i + 0.5)} ${y0} L${x0 + step * (i + 1)} ${y0 + depth}`;
  d += ` L${x1} ${y1 - depth}`;
  for (let i = n; i > 0; i--) d += ` L${x0 + step * (i - 0.5)} ${y1} L${x0 + step * (i - 1)} ${y1 - depth}`;
  return d + 'Z';
};

/* p = { dish, level, top: [{cat, pct}], skipPct, hours, avg, app, date } */
function bonnetjeSvg(p) {
  const X0 = 110, X1 = 970, Y0 = 70, Y1 = 1862, L = X0 + 56, R = X1 - 56, CX = 540;
  const T = (x, y, size, txt, { w = 700, anchor = 'start', fill = '#000', ls = 0 } = {}) =>
    `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" text-anchor="${anchor}" fill="${fill}"${ls ? ` letter-spacing="${ls}"` : ''}>${esc(txt)}</text>`;
  const dash = y => `<line x1="${L}" y1="${y}" x2="${R}" y2="${y}" stroke="#000" stroke-width="4" stroke-dasharray="14 10"/>`;
  const leader = (x1, x2, y) => x2 - x1 > 20 ? `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#000" stroke-width="4" stroke-dasharray="1 11" stroke-linecap="round"/>` : '';
  const row = (y, label, value, tile) => {
    const lx = tile ? L + 80 : L, size = 34;
    const vW = textW(value, 36, 900);
    return (tile || '') + T(lx, y + 12, size, label, { w: 700 }) + leader(lx + textW(label, size, 700) + 16, R - vW - 16, y + 6) + T(R, y + 12, 36, value, { w: 900, anchor: 'end' });
  };
  const tile = (cat, y) => {
    const t = tones(cat.bg);
    return `<rect x="${L}" y="${y - 30}" width="60" height="60" rx="14" fill="${cat.bg}" stroke="#000" stroke-width="4"/>
      <g transform="translate(${L + 30} ${y}) scale(1.6)">${foodSvg(cat.food)}</g>`;
  };

  const S = BON_STR[p.lang], name = p.name;
  const nameSize = Math.min(64, 64 * 660 / Math.max(1, textW(name, 64, 900)));
  const nameW = textW(name, nameSize, 900) + 64;
  const review = p.review;
  const labW = review ? textW(review.label, 42, 900) + 36 : 0;
  const plateF = mono(foodSvg(p.dish.food), tones(p.dish.bg));
  const grade = p.avg.toFixed(1).replace('.', p.lang === 'nl' ? ',' : '.');

  let y = 0;
  const body = [];
  body.push(T(CX, 184, 78, S.title, { w: 900, anchor: 'middle', ls: 2 }));
  body.push(T(CX, 234, 30, S.sub, { w: 800, anchor: 'middle', ls: 10 }));
  body.push(T(CX, 278, 26, [p.date, p.app].filter(Boolean).join('  ·  '), { w: 600, anchor: 'middle', fill: '#444' }));
  body.push(dash(310));

  // profile: plate + badge
  body.push(T(CX, 366, 34, S.youAre, { w: 800, anchor: 'middle' }));
  const PY = 548, PR = 160;
  body.push(`<circle cx="${CX + 10}" cy="${PY + 10}" r="${PR}" fill="#000"/><circle cx="${CX}" cy="${PY}" r="${PR}" fill="${p.dish.bg}" stroke="#000" stroke-width="6"/>
    <circle cx="${CX}" cy="${PY}" r="${PR - 18}" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="4"/>
    <g clip-path="url(#bord)"><g transform="translate(${CX} ${PY + 22}) scale(${PR * 2 / 64})">
      <g transform="translate(15 -17) rotate(14) scale(1.05)">${plateF}</g>
      <g transform="translate(-19 -9) rotate(-12) scale(0.62)">${plateF}</g>
      <g transform="translate(0 4)">${mascot(p.level.key, beltFor(p.dish.bg))}</g></g></g>`);
  y = 780;
  body.push(`<g transform="rotate(-2 ${CX} ${y})">
    <rect x="${CX - nameW / 2 + 9}" y="${y - 50 + 9}" width="${nameW}" height="100" rx="22" fill="#000"/>
    <rect x="${CX - nameW / 2}" y="${y - 50}" width="${nameW}" height="100" rx="22" fill="${p.dish.bg}" stroke="#000" stroke-width="6"/>
    ${T(CX, y + nameSize * 0.36, nameSize, name, { w: 900, anchor: 'middle' })}</g>`);
  body.push(T(CX, 884, 28, p.zin, { w: 700, anchor: 'middle' }));
  body.push(dash(920));

  // items
  body.push(T(L, 974, 30, S.ate, { w: 900, ls: 6 }));
  p.top.forEach((it, i) => { const yy = 1034 + i * 72; body.push(row(yy, it.cat.short, `${it.pct}%`, tile(it.cat, yy))); });
  y = 1034 + p.top.length * 72;
  body.push(row(y + 4, S.skipped, `${p.skipPct}%`));
  body.push(row(y + 58, S.screen, S.hours.replace('{n}', p.hours)));
  body.push(dash(y + 104));

  // feed review
  const RY = y + 156;
  if (review) {
  body.push(T(L, RY, 30, S.review, { w: 900, ls: 6 }));
  body.push(`<g transform="translate(${L + 128} ${RY + 132}) scale(3.9)">${DISH_ART[review.stars]()}</g>`);
  const SX = L + 300;
  body.push(Array.from({ length: 5 }, (_, i) =>
    `<path transform="translate(${SX + 32 + i * 72} ${RY + 62}) scale(3.1)" d="${STAR}" fill="${i < review.stars ? '#FFC93C' : '#fff'}" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/>`).join(''));
  body.push(`<g transform="rotate(-2 ${SX + labW / 2} ${RY + 138})"><rect x="${SX + 6}" y="${RY + 110 + 6}" width="${labW}" height="64" rx="14" fill="#000"/>
    <rect x="${SX}" y="${RY + 110}" width="${labW}" height="64" rx="14" fill="#FFF1C2" stroke="#000" stroke-width="5"/>
    ${T(SX + labW / 2, RY + 157, 42, review.label, { w: 900, anchor: 'middle' })}</g>`);
  body.push(T(SX, RY + 222, 28, S.avg.replace('{n}', grade), { w: 700 }));
  body.push(dash(RY + 268));
  }

  // footer
  const FY = review ? RY + 292 : y + 140;
  body.push(barcode(name, CX - 230, FY, 460, 64));
  body.push(T(CX, FY + 108, 30, S.bye, { w: 800, anchor: 'middle' }));

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${B_W}" height="${B_H}" viewBox="0 0 ${B_W} ${B_H}">
  <defs><style>${FONT_CSS} text{font-family:BonFont,Archivo,system-ui,sans-serif}</style>
    <clipPath id="bord"><circle cx="${CX}" cy="${PY}" r="${PR - 3}"/></clipPath></defs>
  <rect width="${B_W}" height="${B_H}" fill="#67C27E"/>
  ${[[70, 120, 1.4], [1010, 300, 1], [60, 1500, 1.1], [1020, 1680, 1.5]].map(([x, y, s]) =>
    `<path transform="translate(${x} ${y}) scale(${s * 4})" d="M0 -5 L1.3 -1.3 L5 0 L1.3 1.3 L0 5 L-1.3 1.3 L-5 0 L-1.3 -1.3Z" fill="#FFE066" stroke="#000" stroke-width="${1 / (s * 4) * 4}" stroke-linejoin="round"/>`).join('')}
  <!-- scaled to 90% so the top and bottom stay clear of the story app bars -->
  <g transform="translate(540 960) scale(0.9) translate(-540 -960) rotate(-1.2 540 960)">
    <path d="${receiptPath(X0 + 14, Y0 + 14, X1 + 14, Y1 + 14)}" fill="#000"/>
    <path d="${receiptPath(X0, Y0, X1, Y1)}" fill="#FFFDF7" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    ${body.join('\n')}
  </g>
</svg>`;
}
async function bonnetjePng(svg) {
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  await new Promise(r => setTimeout(r, 120));          // give the embedded font a moment
  const c = document.createElement('canvas'); c.width = B_W; c.height = B_H;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, B_W, B_H);
  return new Promise(res => c.toBlob(res, 'image/png'));
}

const catInfo = v => CATS.find(c => c.value === v) || (v === '_klein' ? { value: '_klein', food: 'dango', bg: '#EDEDED' } : FALLBACK);

// p = { d: dish value, l: level key, t: [[value, pct], ...], s: skip %, h: hours/week, a: average rating, p: app, dt: 'YYYYMMDD', lang }
function bonEncode(p) {
  const q = new URLSearchParams({ v: '1', d: p.d, l: p.l, t: p.t.map(([v, n]) => `${v}.${n}`).join(','), s: p.s, h: p.h,
    a: p.a == null ? '' : Math.round(p.a * 10), p: p.p || '', dt: p.dt, lang: p.lang || 'nl' });
  return q.toString();
}
function bonDecode(str) {
  const q = new URLSearchParams(String(str || '').replace(/^#/, ''));
  if (q.get('v') !== '1') return null;
  const num = (k, lo, hi) => { const n = parseInt(q.get(k), 10); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : null; };
  const d = q.get('d'), l = q.get('l');
  if (!BON_CAT_TEXT[d] || !BON_LEVEL_TEXT[l]) return null;
  const t = (q.get('t') || '').split(',').slice(0, 3).map(x => x.split('.')).filter(([v, n]) => BON_CAT_TEXT[v] && /^\d{1,3}$/.test(n)).map(([v, n]) => [v, Math.min(100, +n)]);
  const a = num('a', 10, 100);
  const dt = /^\d{8}$/.test(q.get('dt') || '') ? q.get('dt') : null;
  return { d, l, t, s: num('s', 0, 100) ?? 0, h: num('h', 0, 168) ?? 0, a: a == null ? null : a / 10,
           p: (q.get('p') || '').replace(/[^\p{L}\p{N} ._-]/gu, '').slice(0, 20), dt, lang: q.get('lang') === 'en' ? 'en' : 'nl' };
}
// Turn link values into everything the drawing needs, in the right language
function bonResolve(p) {
  const li = p.lang === 'en' ? 1 : 0;
  const cat = v => { const c = catInfo(v), [label, naam] = BON_CAT_TEXT[v][li]; return { ...c, short: label, naam }; };
  const dish = cat(p.d);
  const [lvName, zin] = BON_LEVEL_TEXT[p.l][li];
  const word = p.l === 'godzilla' || (p.l === 'hamster' && li) ? lvName : lvName.toLowerCase();
  const stars = p.a == null ? 0 : starsFor(p.a);
  const date = p.dt ? new Date(+p.dt.slice(0, 4), +p.dt.slice(4, 6) - 1, +p.dt.slice(6, 8))
    .toLocaleDateString(li ? 'en-GB' : 'nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  return { lang: li ? 'en' : 'nl', dish, level: { key: p.l }, name: `${dish.naam}-${word}`, zin,
           top: p.t.map(([v, n]) => ({ cat: cat(v), pct: n })), skipPct: p.s, hours: p.h, avg: p.a ?? 0,
           review: stars ? { stars, label: BON_REVIEW_TEXT[stars - 1][li] } : null,
           app: p.p, date };
}

async function bonFile(svg, lang) {
  const blob = await bonnetjePng(svg);
  return new File([blob], BON_STR[lang].file, { type: 'image/png' });
}
// Phone, tablet and most laptop browsers: the device's own share menu. Otherwise: download.
async function bonShareOrDownload(svg, lang) {
  const file = await bonFile(svg, lang);
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: BON_STR[lang].shareTitle }); return 'shared'; }
    catch (e) { if (e.name === 'AbortError') return 'cancelled'; }
  }
  bonDownload(file); return 'downloaded';
}
function bonDownload(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function bonQrSvg(url) {
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  return qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
}
  return { bonEncode, bonDecode, bonResolve, bonnetjeSvg, loadFontCss, bonShareOrDownload, bonFile, bonDownload, bonQrSvg, BON_STR, CATS, LEVELS, levelFor };
})();

/* Public bonnetje page: draws the receipt from the link (#v=1&d=...), nothing is stored or sent anywhere. */
(async () => {
  const $ = id => document.getElementById(id);
  const UI = {
    nl: { deel: 'Deel je bonnetje', download: 'Download als plaatje', making: 'Bonnetje maken...', done: 'Gedownload.',
          fail: 'Dat lukte niet. Probeer Download.', over: 'Gemaakt in de Digitaal Dieet studie. Op dit bonnetje staat niets persoonlijks.',
          bad: 'Dit bonnetje kon niet worden geladen. Controleer of je de hele link hebt gekopieerd.', alt: 'Digitaal Dieet bonnetje' },
    en: { deel: 'Share your receipt', download: 'Download as image', making: 'Making your receipt...', done: 'Downloaded.',
          fail: 'That did not work. Try Download.', over: 'Made in the Digital Diet study. There is nothing personal on this receipt.',
          bad: 'This receipt could not be loaded. Check that you copied the whole link.', alt: 'Digital Diet receipt' }
  };
  const raw = BON.bonDecode(location.hash);
  const lang = raw?.lang || ((navigator.language || '').startsWith('en') ? 'en' : 'nl');
  const u = UI[lang] || UI.nl;
  document.documentElement.lang = lang;
  if (!raw) {
    ['bon', 'deel', 'download', 'over'].forEach(id => { $(id).hidden = true; });
    $('fout').hidden = false; $('fout').textContent = u.bad; return;
  }
  const p = BON.bonResolve(raw);
  $('deel').textContent = u.deel; $('download').textContent = u.download; $('over').textContent = u.over; $('bon').alt = `${u.alt}: ${p.name}`;
  let svg = BON.bonnetjeSvg(p);
  const show = () => { $('bon').src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); };
  show();
  await document.fonts.ready; await BON.loadFontCss(); svg = BON.bonnetjeSvg(p); show();

  $('deel').addEventListener('click', async () => {
    $('deel').disabled = true; $('status').textContent = u.making;
    try { const r = await BON.bonShareOrDownload(svg, p.lang); $('status').textContent = r === 'downloaded' ? u.done : ''; }
    catch (e) { $('status').textContent = u.fail; }
    $('deel').disabled = false;
  });
  $('download').addEventListener('click', async () => {
    try { BON.bonDownload(await BON.bonFile(svg, p.lang)); $('status').textContent = u.done; } catch (e) { $('status').textContent = u.fail; }
  });
})();
